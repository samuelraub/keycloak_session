name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, without the v (e.g. 0.3.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - name: Check the request
        run: |
          fail() { echo "::error::$1"; exit 1; }
          [[ "$GITHUB_REF" == refs/heads/main ]] || fail "Releases are cut from main."
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || fail "'$VERSION' is not a version like 0.3.0."
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null; then
            fail "v$VERSION is already tagged."
          fi

      - name: Bump the version
        run: |
          # The release notes are whatever sits under [Unreleased].
          awk '/^## \[/ { on = /Unreleased/; next } on' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "::error::Nothing under [Unreleased] in CHANGELOG.md."
            exit 1
          fi

          TODAY=$(date -u +%F) perl -pi -e \
            's/^## \[Unreleased\]$/## [Unreleased]\n\n## [$ENV{VERSION}] - $ENV{TODAY}/' CHANGELOG.md
          perl -pi -e 's/VERSION = "\K[^"]+/$ENV{VERSION}/' lib/keycloak_session/version.rb
          perl -pi -e 's/tag: "v\K[^"]+/$ENV{VERSION}/' README.md

      - name: Publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: release $VERSION"
          git tag -a "v$VERSION" -m "v$VERSION"
          git push --atomic origin main "v$VERSION"
          gh release create "v$VERSION" --title "v$VERSION" --notes-file "$RUNNER_TEMP/notes.md"
