name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - ruby: "3.2"
            rails: "~> 7.1.0"
            jwt: "~> 2.7.0"
          - ruby: "3.3"
            rails: "~> 8.0.0"
          - ruby: "4.0"
            rails: "~> 8.1.0"
    env:
      RAILS_VERSION: ${{ matrix.rails }}
      JWT_VERSION: ${{ matrix.jwt }}
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rake spec

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - run: bundle exec rake standard
