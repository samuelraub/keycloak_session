name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Advisories and new releases of unlocked dependencies appear without a push.
  schedule:
    - cron: "41 5 * * 1"
  # The release workflow runs this first.
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - ruby: "3.3"
            rails: "~> 8.0.0"
            jwt: "~> 2.7.0"
          - ruby: "4.0"
            rails: "~> 8.1.0"
    env:
      RAILS_VERSION: ${{ matrix.rails }}
      JWT_VERSION: ${{ matrix.jwt }}
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rake spec
      - run: bundle exec rake spec
        env:
          PLAINTEXT_TOKENS: "1"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - run: bundle exec rake standard

  # The one check branch protection requires, so the matrix can change.
  ci:
    if: always()
    needs: [test, lint]
    runs-on: ubuntu-latest
    steps:
      - name: All jobs passed
        run: |
          echo '${{ toJSON(needs.*.result) }}'
          ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && !contains(needs.*.result, 'skipped') }}
